name: Test

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: npm

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        with:
          chrome-version: stable
          install-chromedriver: false

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Patch jasmine-browser-runner for WebGL support
        run: node scripts/patch-jasmine-webdriver.js

      - name: Run Jasmine tests (Chrome headless via CI config)
        run: npx jasmine-browser-runner runSpecs --config=spec/support/jasmine-browser.ci.mjs
        env:
          CI: true